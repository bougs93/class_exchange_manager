<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="class_exchange_manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>class_exchange_manager</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Syncfusion PDF Viewer 웹 렌더링용 pdf.js (필수 — 없으면 미리보기 로드 실패)

       async로 받는다. 예전에는 async/defer 없이 받아서 이 스크립트가 끝날
       때까지 HTML 파싱이 멈췄고, 그만큼 아래 Flutter 부트스트랩 실행이
       늦어졌다. pdf.js는 문서 출력 화면에서 미리보기를 열 때만 쓰므로
       첫 화면이 뜨는 길목에 둘 이유가 없다(2026-10-02).

       워커 경로 설정은 인라인 스크립트로 두면 async 로드보다 먼저 실행돼
       `pdfjsLib`가 없어 터진다. 그래서 onload 시점으로 옮겼다. -->
  <script
    async
    src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"
    onload="window.pdfjsLib && (pdfjsLib.GlobalWorkerOptions.workerSrc='//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js')"
  ></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
